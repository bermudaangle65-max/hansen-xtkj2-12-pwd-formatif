<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kumpulan Tombol</title>

    <style>
        /* 1. Pengaturan seluruh halaman */
body {
    background-color: #f5f7fb;
    font-family: Arial, sans-serif;
}

/* 2. Judul */
h2 {
    color: navy;
    font-size: 20px;
}

/* 3. Pengaturan semua tombol */
.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
}

/* 4. Jarak antar tombol */
.button-group .btn {
    margin-right: 10px;
    margin-bottom: 10px;
}

/* 5. Tombol pertama */
.btn-primary {
    background-color: rgb(40, 100, 200);
    color: white;
}

/* 6. Tombol kedua */
.btn-secondary {
    background-color: rgba(40, 160, 120, 0.95);
}

/* 7. Tombol ketiga */
.btn-outline {
    background-color: white;
    border: 2px solid #333333;
}

/* 8. Warna tulisan tombol kedua dan ketiga */
.btn-secondary,
.btn-outline {
    color: #222222;
}

/* 9. Tombol keempat */
.btn-send {
    background-color: darkorange;
    color: white;
}

/* 10. Efek ketika tombol pertama disentuh */
.btn-primary:hover {
    background-color: navy;
}

/* 11. Efek tombol kedua */
.btn-secondary:hover {
    background-color: #16845d;
}

/* 12. Efek tombol ketiga */
.btn-outline:hover {
    background-color: rgb(220, 230, 245);
}

/* 13. Efek tombol keempat */
.btn-send:hover {
    background-color: rgba(180, 75, 20, 1);
}
    
body {
    background-color: #f5f7fb;
    font-family: Arial, sans-serif;
}    
    
body {

        linear-gradient(

        ),
        url("../assets/images/Backgrod.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    font-family: Arial, sans-serif;
    min-height: 100vh;
}

main {
    max-width: 900px;
    margin: 60px auto;
    padding: 35px;
    text-align: center;

    background-color: rgba(255, 255, 255, 0.85);
    border-radius: 20px;
}

h2 {
    color: navy;
    font-size: 20px;
    text-align: center;
}

footer {
    text-align: center;
    margin-top: 20px;
}
    </style>
</head>

<body>

    <main>
        <h2>Kumpulan Tombol</h2>

        <div class="button-group">


            <a href="../pages/gallery.html"

            </a>

            <a href="#"

                Unduh CV
            </a>

            <a href="../pages/contact.html"
               class="btn btn-outline">

            </a>

            <a href="../pages/contact.html"
               class="btn btn-send">
                Kirim Pesan
            </a>

        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
