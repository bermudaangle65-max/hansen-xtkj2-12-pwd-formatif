<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kartu Proyek</title>

    <style>
/* Hitungan lebar tanpa box-sizing:
   320 + 40 + 4 = 364px */

/* 1. Universal Selector */
* {
    box-sizing: border-box;
}


body {
    margin: 0;
    background-color: #f5f7fb;

    background-image:
        linear-gradient(
            rgba(245, 247, 251, 0.65),
            rgba(245, 247, 251, 0.65)
        ),
        url("../assets/images/Background.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    font-family: Arial, sans-serif;
}


.card {
    width: 320px;
    padding: 20px;
    border: 2px solid #333333;
    margin: 30px auto;

    background-color: white;
    border-radius: 16px;

    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}


.card img {
    width: 100%;
    height: 160px;
    display: block;
    object-fit: cover;

    border-radius: 10px;
}


.card h3 {
    color: #222222;
    margin-bottom: 8px;
    font-size: 20px;
}


.card p {
    font-size: 15px;
    line-height: 1.6;
    color: #444444;
}


.card a {
    display: inline-block;
    padding: 10px 18px;

    color: white;
    background-color: #2563eb;

    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}


.card a:hover {
    background-color: navy;
}

/* Footer */
footer {
    text-align: center;
    padding: 20px;
}
    </style>
</head>

<body>

    <main>

        <div class="card">

            <img src="../assets/images/Proyek 1.png"
                 alt="Gambar proyek Hansen">

            <h3>Proyek Website Pertamaku</h3>

            <p>
                Saya sedang belajar membuat website menggunakan HTML
                dan CSS. Proyek ini membantu saya memahami dasar
                pembuatan halaman web.
            </p>

            <a href="#">Lihat Proyek</a>

        </div>

    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
