<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulir Kontak</title>

    <style>
      
body {
    margin: 0;
    background-color: #eaf1fb;
    font-family: Arial, sans-serif;
}


#contact {
    padding: 40px 20px;
}


.contact-form {
    width: 400px;
    max-width: 100%;
    margin: 0 auto;
    padding: 24px;
    border: 1px solid #cccccc;
    box-sizing: border-box;

    background-color: white;
    border-radius: 15px;

    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
}


.contact-form h2 {
    text-align: center;
    color: navy;
    margin-bottom: 25px;
}


.form-group {
    margin-bottom: 16px;
}


.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}


.form-group input,
.form-group textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid #cccccc;
    border-radius: 8px;

    font-family: Arial, sans-serif;
    font-size: 15px;
}


.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #2563eb;
    background-color: #eef5ff;
}


.btn-submit {
    background-color: #2563eb;
    color: white;
    padding: 12px 22px;

    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}


.btn-submit:hover {
    background-color: navy;
}


footer {
    text-align: center;
    padding: 20px;
}

footer a {
    color: navy;
    text-decoration: none;
    font-weight: bold;
}
    </style>
</head>

<body>

    <section id="contact">

        <form class="contact-form">

            <h2>Hubungi Saya</h2>

            <!-- Form Nama -->
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama kamu"
                >
            </div>

            <!-- Form Email -->
            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email kamu"
                >
            </div>

            <!-- Form Pesan -->
            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea
                    id="pesan"
                    name="pesan"
                    rows="5"
                    placeholder="Tuliskan pesan kamu"
                ></textarea>
            </div>

            <button type="submit" class="btn-submit">
                Kirim Pesan
            </button>

        </form>

    </section>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
